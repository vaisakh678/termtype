root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/termtype"
  cmd = "go build -o ./tmp/termtype ."
  delay = 500
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "mod"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
